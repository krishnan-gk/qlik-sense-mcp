# =============================================================================
# nginx — Qlik MCP per-user routing
# =============================================================================
# Routes /qlik-mcp/<username>/ → the user's mcpo container port.
#
# Each user gets a path-based endpoint. Their Gemini agent points to:
#   https://qlik-mcp.ispot.tv/qlik-mcp/<username>/
#
# SSL termination happens here. The mcpo containers use plain HTTP internally.
# =============================================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;

    # ── Rate limiting (protect the Qlik server) ─────────────────────────────
    limit_req_zone $binary_remote_addr zone=qlik_mcp:10m rate=10r/s;

    # ── Redirect HTTP → HTTPS ────────────────────────────────────────────────
    server {
        listen 80;
        server_name qlik-mcp.ispot.tv;
        return 301 https://$host$request_uri;
    }

    # ── Main HTTPS server ────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name qlik-mcp.ispot.tv;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # ── Template location block — copy for each user ───────────────────
        # Uncomment and duplicate for each user.
        # Map username → port where their mcpo container is listening.

        # location /qlik-mcp/alice/ {
        #     limit_req zone=qlik_mcp burst=20 nodelay;
        #     proxy_pass http://localhost:8001/;
        #     proxy_http_version 1.1;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #     # SSE / streaming support
        #     proxy_set_header Connection '';
        #     proxy_buffering off;
        #     proxy_cache off;
        #     proxy_read_timeout 300s;
        # }

        # location /qlik-mcp/bob/ {
        #     limit_req zone=qlik_mcp burst=20 nodelay;
        #     proxy_pass http://localhost:8002/;
        #     proxy_http_version 1.1;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #     proxy_set_header Connection '';
        #     proxy_buffering off;
        #     proxy_cache off;
        #     proxy_read_timeout 300s;
        # }

        # ── Health check (unauthenticated) ─────────────────────────────────
        location /health {
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # ── Default: 404 for anything not matched ──────────────────────────
        location / {
            return 404 "Not found. Use /qlik-mcp/<username>/\n";
            add_header Content-Type text/plain;
        }
    }
}
